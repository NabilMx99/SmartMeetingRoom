<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Meeting Room | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="icon" type="image/svg" href="images/icons/favicon.svg">
</head>
<body>
    <!-- Header -->
    <div class="header-bar">
        <h1>Dashboard</h1>
        <div class="user-actions">
            <!-- User Profile Logo -->
            <span id="welcomeName" class="welcome-text"></span>
            <img src="images/icons/user-profile.jpg" alt="User Profile" style="cursor:pointer;">
            <button onclick="logout()">Logout</button>
        </div>
    </div>
    <!-- Summary Widgets -->
    <div class="dashboard-container">
        <div class="summary-widgets grid-3">
            <div class="widget">
                <h3>Today's Meetings<i class="fas fa-users"></i></h3>
                <p class="widget-number" id="meetingsCount">0</p> 
            </div>
            <div class="widget">
                <h3>Available Rooms<i class="fas fa-door-open"></i></h3>
                <p class="widget-number" id="availableRoomsCount">0</p> 
            </div>
        </div>
        <div class="grid-2">
            <div>
                <!-- Upcoming Meetings -->
                <div class="section upcoming-meetings">
                    <h2 class="section-title"><i class="fas fa-calendar-alt"></i>Upcoming Meetings</h2>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Start Time</th>
                                    <th>End Time</th>
                                    <th>Status</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- Quick Actions -->
                <div class="section quick-actions">
                    <h2 class="section-title"><i class="fas fa-bolt"></i>Quick Actions</h2>
                    <button class="schedule"><i class="fas fa-calendar-plus"></i>Schedule Meeting</button>
                    <button class="join"><i class="fas fa-video"></i>Join Now</button>
                    <button class="minutes"><i class="fas fa-file-alt"></i>View Minutes</button>
                </div>
                <!-- Rooms -->
                <div class="section rooms">
                    <h2 class="section-title"><i class="fas fa-door-closed"></i>Rooms</h2>
                    <div class="table-wrapper">
                        <table id="roomTable">
                            <thead>
                                <tr>
                                    <th>Room</th>
                                    <th>Location</th>
                                    <th>Capacity</th>
                                    <th>Status</th>
                                    <th>Feature(s)</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <!-- Notifications -->
            <div class="section notifications">
                <h2 class="section-title"><i class="fas fa-bell"></i>Notifications</h2>
                <ul>
                    <li>No notifications</li>
                </ul>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
