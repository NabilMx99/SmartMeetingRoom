<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Meeting Room | Book Meeting</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <div class="form-card">
        <h2>Book a Meeting Room</h2>
        <p class="subtitle">Fill in the details to reserve your room</p>

        <form id="bookingForm">
            <!-- Meeting Title -->
            <label for="title">Meeting Title</label>
            <input type="text" id="title" name="title" placeholder="Project Discussion" required>

            <!-- Date/Time -->
            <label for="datetime">Date & Time</label>
            <input type="datetime-local" id="datetime" name="datetime" required>

            <!-- Duration -->
            <label for="duration">Duration (hours)</label>
            <input type="number" id="duration" name="duration" min="0.5" step="0.5" required>

            <!-- Attendees -->
            <label for="attendees">Attendees</label>
            <input type="text" id="attendees" name="attendees" placeholder="Search or add attendees" required>

            <!-- Room -->
            <label for="room">Select Room</label>
            <select id="room" name="room" required>
                <option value="">-- Select a Room --</option>
                <option value="Room A">Room A</option>
                <option value="Room B">Room B</option>
                <option value="Room C">Room C</option>
            </select>

            <!-- Room Availability Preview -->
            <div class="availability-preview">
                <p><strong>Room Availability:</strong></p>
                <div class="availability-color green">Available</div>
                <div class="availability-color red">Booked</div>
            </div>

            <!-- Options -->
            <div class="form-check">
            <input type="checkbox" id="recurring" name="recurring">
            <label for="recurring">Recurring Meeting</label>
            </div>

            <div class="form-check">
            <input type="checkbox" id="video" name="video">
            <label for="video">Enable Video Conferencing</label>
            </div>

            <!-- Buttons -->
            <div class="form-buttons">
                <button type="submit">Book Now</button>
                <button type="button" class="cancel" onclick="window.location.href='dashboard.html'">Cancel</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Meeting room booked successfully!');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
