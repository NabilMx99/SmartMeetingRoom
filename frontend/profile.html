<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Meeting Room | Profile</title>
  <link rel="icon" type="image/svg" href="images/icons/favicon.svg">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <div class="container">
    <h2>Your Profile</h2>
    <form id="profileForm">
      <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
      <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>
      <input type="email" id="email" name="email" placeholder="Email" readonly>
      <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Phone Number">
      <button type="submit" class="update">Update Profile</button>
    </form>

    <button id="deleteAccountBtn" class="delete">Delete Account</button>
    <a class="back" href="dashboard.html">Back to Dashboard</a>

    <div id="profileMessage" class="subtitle"></div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
